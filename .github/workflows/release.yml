name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"      # stable:     v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*"    # prerelease: v1.2.3-beta.1

permissions:
  contents: write
  id-token: write      # required for GitHub Attestations
  attestations: write  # required for GitHub Attestations

jobs:
  build:
    name: ${{ matrix.rust-target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14          # Apple Silicon (arm64)
            rust-target: aarch64-apple-darwin
            ytdlp-asset: yt-dlp_macos
            bgutil-asset: bgutil-pot-macos-aarch64

          # Intel (x86_64) disabled — Rosetta deprecated, arm64 covers all modern Macs
          # - platform: macos-13
          #   rust-target: x86_64-apple-darwin
          #   ytdlp-asset: yt-dlp_macos
          #   bgutil-asset: bgutil-pot-macos-x86_64

          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            ytdlp-asset: yt-dlp.exe
            bgutil-asset: bgutil-pot-windows-x86_64.exe

          - platform: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            ytdlp-asset: yt-dlp_linux
            bgutil-asset: bgutil-pot-linux-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      # ── Node ────────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # ── Rust ────────────────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust-target }}

      # Install before fetching sidecars. ffmpeg-static's install hook places
      # the pinned, platform-specific static FFmpeg binary in node_modules.
      - name: Install Node dependencies
        run: npm ci

      # ── System dependencies (Linux only) ────────────────────────────────────
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf

      # ── Sidecar binaries (cached monthly) ───────────────────────────────────
      - name: Cache month (sidecar rotation)
        id: cache-ym
        shell: bash
        run: echo "ym=$(date +'%Y-%m')" >> $GITHUB_OUTPUT

      - name: Cache sidecar binaries
        id: cache-sidecars
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: sidecars-${{ matrix.rust-target }}-${{ steps.cache-ym.outputs.ym }}
          restore-keys: |
            sidecars-${{ matrix.rust-target }}-

      - name: Download yt-dlp (Unix)
        if: steps.cache-sidecars.outputs.cache-hit != 'true' && runner.os != 'Windows'
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
          YTDLP_ASSET: ${{ matrix.ytdlp-asset }}
        run: |
          curl -fsSL \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/$YTDLP_ASSET" \
            -o "src-tauri/binaries/yt-dlp-$RUST_TARGET"
          chmod +x "src-tauri/binaries/yt-dlp-$RUST_TARGET"

      - name: Download yt-dlp (Windows)
        if: steps.cache-sidecars.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "src-tauri\binaries\yt-dlp-$env:RUST_TARGET.exe"

      - name: Copy static ffmpeg sidecar (Unix)
        if: runner.os != 'Windows'
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          TAURI_TARGET="$RUST_TARGET" node scripts/copy-verified-ffmpeg.cjs \
            "src-tauri/binaries/ffmpeg-$RUST_TARGET"

      - name: Verify macOS ffmpeg sidecar
        if: runner.os == 'macOS'
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          bash scripts/verify-macos-ffmpeg.sh \
            "src-tauri/binaries/ffmpeg-$RUST_TARGET"

      - name: Download ffmpeg (Windows)
        if: steps.cache-sidecars.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          FFMPEG_ASSET: "ffmpeg-master-latest-win64-gpl.zip"
        run: |
          $baseUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
          Invoke-WebRequest -Uri "$baseUrl/$env:FFMPEG_ASSET" -OutFile ffmpeg.zip
          Invoke-WebRequest -Uri "$baseUrl/checksums.sha256" -OutFile checksums.sha256

          $checksumLine = Select-String -Path checksums.sha256 -Pattern ([regex]::Escape($env:FFMPEG_ASSET))
          if (-not $checksumLine) {
            Write-Error "Could not find checksum entry for $env:FFMPEG_ASSET in checksums.sha256"
            exit 1
          }
          $expected = ($checksumLine.Line -split '\s+')[0].ToLower()
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            Write-Error "ffmpeg SHA256 mismatch: expected $expected, got $actual"
            exit 1
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem -Recurse -Filter ffmpeg.exe ffmpeg_tmp | Select-Object -First 1
          Copy-Item $exe.FullName "src-tauri\binaries\ffmpeg-${{ matrix.rust-target }}.exe"
          Remove-Item -Recurse -Force ffmpeg.zip, checksums.sha256, ffmpeg_tmp

      - name: Download bgutil-pot (Unix)
        if: steps.cache-sidecars.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: |
          curl -fsSL \
            "https://github.com/jim60105/bgutil-ytdlp-pot-provider-rs/releases/latest/download/${{ matrix.bgutil-asset }}" \
            -o "src-tauri/binaries/bgutil-pot-${{ matrix.rust-target }}"
          chmod +x "src-tauri/binaries/bgutil-pot-${{ matrix.rust-target }}"

      - name: Download bgutil-pot (Windows)
        if: steps.cache-sidecars.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/jim60105/bgutil-ytdlp-pot-provider-rs/releases/latest/download/${{ matrix.bgutil-asset }}" `
            -OutFile "src-tauri\binaries\bgutil-pot-${{ matrix.rust-target }}.exe"

      # bgutil-pot's upstream Linux build links dynamically against libssl.so.3/libcrypto.so.3
      # (OpenSSL 3.x) — absent on distros still on OpenSSL 1.1 (e.g. Ubuntu 20.04). Resolve the
      # exact files this build needs via ldd (native arch on this runner, so ldd works directly)
      # and bundle them as a resource; src-tauri/src/sidecar.rs points LD_LIBRARY_PATH at them
      # when spawning bgutil-pot, so the sidecar never touches the host's OpenSSL.
      - name: Bundle bgutil-pot OpenSSL libs (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p src-tauri/binaries/bgutil-pot-libs
          for lib in libssl.so.3 libcrypto.so.3; do
            path=$(ldd "src-tauri/binaries/bgutil-pot-${{ matrix.rust-target }}" | awk -v l="$lib" '$1==l {print $3}')
            if [ -z "$path" ]; then
              echo "Could not resolve $lib via ldd for bgutil-pot" >&2
              exit 1
            fi
            cp "$path" "src-tauri/binaries/bgutil-pot-libs/$lib"
          done

      # ── Tauri build + create GitHub Release ──────────────────────────────────
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          VITE_UMAMI_WEBSITE_ID: ${{ secrets.VITE_UMAMI_WEBSITE_ID }}
          VITE_GLITCHTIP_DSN: ${{ secrets.VITE_GLITCHTIP_DSN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "StroyGetter ${{ github.ref_name }}"
          releaseBody: ""
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.rust-target }}

      # ── Post-build: checksums, signatures, verification ──────────────────────

      # Detect which secrets are configured (optional features)
      - name: Detect optional secrets
        id: secrets
        shell: bash
        run: |
          echo "has_gpg=${{ secrets.GPG_PRIVATE_KEY != '' }}" >> $GITHUB_OUTPUT
          echo "has_vt=${{ secrets.VT_API_KEY != '' }}"      >> $GITHUB_OUTPUT

      # Find the installer/package files produced by tauri build
      - name: Locate bundle artifacts
        id: bundle
        shell: bash
        run: |
          dir="src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          find "$dir" -type f \( \
            -name "*.dmg" -o -name "*.exe" -o -name "*.msi" \
            -o -name "*.AppImage" -o -name "*.deb" \
          \) | sort > artifacts.txt
          echo "Found artifacts:"
          cat artifacts.txt

      # Verify the binary after Tauri has copied it into the installed app.
      # This catches bundle-time regressions, not just a bad source sidecar.
      - name: Smoke-test packaged macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg="$(find "src-tauri/target/${{ matrix.rust-target }}/release/bundle" \
            -type f -name '*.dmg' -print -quit)"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet 2>/dev/null || true
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          bash scripts/verify-macos-ffmpeg.sh \
            "$mount_dir/StroyGetter.app/Contents/MacOS/ffmpeg"

      # SHA-256 checksum file — always generated, uploaded to the release
      - name: SHA-256 checksums
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          checksum_file="SHA256SUMS-${{ matrix.rust-target }}.txt"
          while IFS= read -r f; do
            if command -v sha256sum &>/dev/null; then
              sha256sum "$f"
            else
              shasum -a 256 "$f"
            fi
          done < artifacts.txt > "$checksum_file"
          echo "--- checksums ---"
          cat "$checksum_file"
          gh release upload "${{ github.ref_name }}" "$checksum_file" --clobber

      # GitHub Attestations — cryptographic SLSA provenance (free, no secrets needed)
      # Proves each binary was produced by this repo's CI from a specific commit.
      # Verify: gh attestation verify <file> --repo DestroyCom/Stroygetter-Native
      - name: GitHub provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.deb

      # GPG signing — optional, runs only if GPG_PRIVATE_KEY secret is set.
      # Produces a .asc detached signature alongside each installer.
      # Setup: see SECURITY.md for key generation instructions.
      - name: GPG sign artifacts
        if: steps.secrets.outputs.has_gpg == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --passphrase "$GPG_PASSPHRASE" --import
          while IFS= read -r f; do
            gpg --batch --yes \
              --passphrase "$GPG_PASSPHRASE" \
              --pinentry-mode loopback \
              --detach-sign --armor "$f"
            gh release upload "${{ github.ref_name }}" "${f}.asc" --clobber
          done < artifacts.txt

      # VirusTotal scan — optional, runs only if VT_API_KEY secret is set.
      # Free API key: https://www.virustotal.com (no credit card, 500 scans/day)
      - name: VirusTotal scan
        id: vt
        if: steps.secrets.outputs.has_vt == 'true'
        uses: crazy-max/ghaction-virustotal@v5
        with:
          files: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.deb
          vt_api_key: ${{ secrets.VT_API_KEY }}

      # Write the VT scan URLs into a file and upload it to the release.
      # The publish job (below) will aggregate all platforms into the release body.
      - name: Upload VirusTotal results
        if: steps.secrets.outputs.has_vt == 'true' && steps.vt.outputs.analysis != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '${{ steps.vt.outputs.analysis }}' \
            | tr ',' '\n' \
            | while read -r pair; do
                [ -z "$pair" ] && continue
                file="${pair%%=*}"
                url="${pair#*=}"
                echo "- [\`$(basename "$file")\`]($url)"
              done \
            > "vt-${{ matrix.rust-target }}.md"
          gh release upload "${{ github.ref_name }}" \
            "vt-${{ matrix.rust-target }}.md" --clobber

  # ── Post-build: aggregate results and update release body ────────────────────
  publish:
    name: Update release notes
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Download all per-platform VT result files uploaded to the release
      - name: Collect VirusTotal results
        id: vt-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download VT markdown files if they exist
          gh release download "${{ github.ref_name }}" \
            --pattern "vt-*.md" --dir vt-results 2>/dev/null || true

          if [ -d vt-results ] && [ "$(ls vt-results/*.md 2>/dev/null | wc -l)" -gt 0 ]; then
            {
              echo "## VirusTotal scans"
              echo ""
              echo "All installers were scanned by 70+ antivirus engines at release time:"
              echo ""
              cat vt-results/*.md | sort -u
            } > vt-section.md
            echo "has_vt=true" >> $GITHUB_OUTPUT
          else
            echo "has_vt=false" >> $GITHUB_OUTPUT
          fi

      # Build the final release body and update it
      - name: Update release body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          export SHORT_SHA="${SHORT_SHA:0:7}"
          envsubst < .github/release-body-template.md > release-body.md
          if [ -f vt-section.md ]; then
            printf '\n' >> release-body.md
            cat vt-section.md >> release-body.md
          fi
          gh release edit "${TAG}" --notes-file release-body.md --draft=false
